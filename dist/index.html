<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Agent 文档标签管理交互原型" />
  <title>标签管理 · Agent管理</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5ce2'/%3E%3Cpath d='M8 9h10l6 6-9 9-7-7V9Z' fill='none' stroke='white' stroke-width='2.3' stroke-linejoin='round'/%3E%3Ccircle cx='13' cy='14' r='1.8' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-logo" src="./qianjiang-zhiyuan-logo.png" alt="千匠智元" /></div>
      <nav class="nav" aria-label="主导航">
        <button class="nav-group"><span><i data-icon="tool"></i>开发工具</span><i data-icon="chevron"></i></button>
        <button class="nav-group"><span><i data-icon="spark"></i>AI 能力工厂</span><i data-icon="chevron"></i></button>
        <button class="nav-group"><span><i data-icon="database"></i>资源中心</span><i data-icon="chevron"></i></button>
        <button class="nav-group"><span><i data-icon="shield"></i>安全与审计</span><i data-icon="chevron"></i></button>
        <button class="nav-group"><span><i data-icon="key"></i>token聚合管理</span><i data-icon="chevron"></i></button>
        <button class="nav-group"><span><i data-icon="code"></i>API KEYS</span><i data-icon="chevron"></i></button>
        <div class="nav-section">
          <button class="nav-group expanded"><span><i data-icon="bot"></i>Agent管理</span><i data-icon="up"></i></button>
          <div class="nav-children">
            <button>智能体管理</button><button>知识库管理</button><button>文档列表</button>
            <button class="active"><i data-icon="tag"></i>标签管理</button>
            <button>技能库管理</button><button>Prompt管理</button><button>业务术语管理</button><button>会话管理</button>
          </div>
        </div>
      </nav>
      <button class="collapse" aria-label="收起侧边栏"><i data-icon="panel"></i></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="tabs"><span>项目管理</span><span>智能体管理 <b>×</b></span><span>文档列表 <b>×</b></span><span class="current">标签管理 <b>×</b></span></div>
        <div class="user">15212143895 <span class="avatar">秦</span></div>
      </header>
      <div class="breadcrumb">Agent管理 <span>/</span> 标签管理</div>

      <div class="content">
        <section class="page-head">
          <div><h1>标签管理</h1><p>统一管理文档标签，提高知识分类与检索效率</p></div>
          <button class="primary" id="createBtn"><i data-icon="plus"></i>新建标签</button>
        </section>

        <section class="stats" aria-label="标签概览">
          <article><div><span>标签总数</span><strong id="totalStat">24</strong></div><div class="stat-icon violet"><i data-icon="tag"></i></div></article>
          <article><div><span>已关联文档</span><strong>186</strong></div><div class="stat-icon blue"><i data-icon="file"></i></div></article>
          <article><div><span>本月新增</span><strong>6</strong><small>↑ 20%</small></div><div class="stat-icon green"><i data-icon="trend"></i></div></article>
          <article><div><span>待完善标签</span><strong>3</strong></div><div class="stat-icon amber"><i data-icon="alert"></i></div></article>
        </section>

        <section class="workspace">
          <div class="view-tabs" role="tablist">
            <button class="active" data-view="library">标签库 <em>24</em></button>
            <button data-view="rules">智能规则 <em>5</em></button>
            <button data-view="relations">文档打标</button>
          </div>
          <div class="filters">
            <div class="search"><i data-icon="search"></i><input id="searchInput" placeholder="搜索标签名称或描述" /><kbd>⌘ K</kbd></div>
            <select id="groupFilter" aria-label="标签分组"><option value="">全部分组</option><option>文档类型</option><option>业务领域</option><option>项目阶段</option><option>风险等级</option></select>
            <select id="statusFilter" aria-label="状态"><option value="">全部状态</option><option value="enabled">已启用</option><option value="disabled">已停用</option></select>
            <button class="ghost"><i data-icon="filter"></i>更多筛选</button>
            <div class="spacer"></div>
            <button class="icon-button" title="刷新" id="refreshBtn"><i data-icon="refresh"></i></button>
            <button class="ghost"><i data-icon="download"></i>导出</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead><tr><th><input type="checkbox" aria-label="全选" /></th><th>标签名称</th><th>分组</th><th>关联文档</th><th>创建方式</th><th>更新时间</th><th>状态</th><th>操作</th></tr></thead>
              <tbody id="tagRows"></tbody>
            </table>
            <div class="empty" id="emptyState"><div class="empty-icon"><i data-icon="search"></i></div><h3>没有找到匹配的标签</h3><p>请调整搜索条件或创建新标签</p><button class="ghost" id="clearFilter">清除筛选</button></div>
          </div>
          <div class="table-footer"><span>共 <b id="resultCount">8</b> 条记录</span><div class="pagination"><button disabled>‹</button><button class="active">1</button><button>2</button><button>3</button><button>›</button></div></div>
        </section>
      </div>
    </main>
  </div>

  <div class="overlay" id="modalOverlay" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><h2 id="modalTitle">新建标签</h2><p>标签将用于文档分类、筛选和智能检索</p></div><button class="close" data-close>×</button></div>
      <form id="createForm">
        <label>标签名称 <b>*</b><input name="name" maxlength="20" required placeholder="例如：需求文档" /></label>
        <div class="form-row"><label>标签分组 <b>*</b><select name="group" required><option value="">请选择分组</option><option>文档类型</option><option>业务领域</option><option>项目阶段</option><option>风险等级</option></select></label><label>标签颜色<div class="color-picker" id="colorPicker"><button type="button" class="selected" data-color="#696cff"></button><button type="button" data-color="#25b8f7"></button><button type="button" data-color="#20c997"></button><button type="button" data-color="#ffb020"></button><button type="button" data-color="#ff5d72"></button></div></label></div>
        <label>标签描述<textarea name="description" rows="3" placeholder="说明该标签的适用范围，便于团队正确使用"></textarea></label>
        <label class="switch-line"><span><b>创建后立即启用</b><small>启用后可在文档中选择此标签</small></span><input type="checkbox" name="enabled" checked /><i></i></label>
        <div class="modal-actions"><button type="button" class="ghost" data-close>取消</button><button type="submit" class="primary">创建标签</button></div>
      </form>
    </section>
  </div>

  <div class="drawer-shell" id="drawerShell" hidden><div class="drawer-scrim" data-drawer-close></div><aside class="drawer" aria-label="标签详情">
    <div class="drawer-head"><div><span>标签详情</span><h2 id="drawerTitle">需求文档</h2></div><button class="close" data-drawer-close>×</button></div>
    <div class="drawer-body"><div class="tag-preview"><span id="drawerDot"></span><b id="drawerTag">需求文档</b><small id="drawerStatus">已启用</small></div><dl><div><dt>所属分组</dt><dd id="drawerGroup">文档类型</dd></div><div><dt>创建方式</dt><dd id="drawerType">手动创建</dd></div><div><dt>最近更新</dt><dd id="drawerTime">2026-09-20 11:42</dd></div></dl><div class="drawer-section"><div class="section-title"><h3>关联文档</h3><span id="drawerCount">32 篇</span></div><div id="relatedDocs"></div></div></div>
    <div class="drawer-actions"><button class="danger">删除标签</button><button class="primary"><i data-icon="edit"></i>编辑标签</button></div>
  </aside></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
